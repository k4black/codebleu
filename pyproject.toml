[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"


[project]
name = "codebleu"
description = "Unofficial CodeBLEU implementation that supports Linux, MacOS and Windows available on PyPI."
readme = "README.md"
license = "MIT"
authors = [
  {name = "Konstantin Chernyshev"},
]
keywords = ["codebleu", "code", "bleu", "nlp", "natural language processing", "programming", "evaluate", "evaluation", "code generation", "metrics"]
dynamic = ["version"]

requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed"
]

dependencies = [
    "tree-sitter >=0.26.1,<0.27.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["codebleu", "codebleu.parser", "codebleu.keywords"]
exclude = ["tests", "tests.*", "codebleu.parser.tree-sitter"]


[tool.setuptools.package-data]
"*" = ["py.typed", "*.txt", "keywords/*"]


[project.scripts]
codebleu = "codebleu.__main__:cli"

[project.urls]
Homepage = "https://github.com/k4black/codebleu"
Issues = "https://github.com/k4black/codebleu/issues"
"Pull Requests" = "https://github.com/k4black/codebleu/pulls"
Security = "https://github.com/k4black/codebleu/security/advisories/new"

[project.optional-dependencies]
all = [
    "tree-sitter-python ~=0.25.0",
    "tree-sitter-go ~=0.25.0",
    "tree-sitter-javascript ~=0.25.0",
    "tree-sitter-ruby ~=0.23.1",
    "tree-sitter-php ~=0.25.1",
    "tree-sitter-java ~=0.23.5",
    "tree-sitter-c-sharp ~=0.23.5",
    "tree-sitter-c ~=0.24.2",
    "tree-sitter-cpp ~=0.23.4",
    "tree-sitter-rust ~=0.24.2",
    "tree-sitter-typescript ~=0.23.2",
    "tree-sitter-fortran ~=0.6.0",
]
test = [
    "pytest >=9.2.0,<10.0.0",
    "pytest-cov >=7.1.0,<8.0.0",
    "pytest-timeout >=2.4.0,<3.0.0",
    "ruff >=0.17.4,<0.18.0",
    "ty ==0.0.100",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}


[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=codebleu --cov-report term-missing"

[tool.coverage.run]
omit = ["tests/*", "codebleu/parser/tree-sitter/*", "tree_sitter"]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.11"
