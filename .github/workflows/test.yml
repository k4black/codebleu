name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[all,test]'
      - name: Check imports
        run: python -m isort codebleu tests --check
      - name: Check formatting
        run: python -m black codebleu tests --check
      - name: Check lint
        run: python -m ruff check codebleu tests
      - name: Check types
        run: python -m mypy codebleu

  fast-tests-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[all,test]'
      - name: Test source
        run: python -m pytest

  full-tests-python:
    needs: [fast-tests-python]
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
      fail-fast: false
    name: Test wheel on ${{ matrix.os }} and Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install 'build>=1.6.1,<2'
          python -m build
      - name: Install wheel and extras
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[all,test]"
          python -m pip check
      - name: Check installed package
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import pathlib, sysconfig, codebleu;
          assert pathlib.Path(codebleu.__file__).is_relative_to(sysconfig.get_path('purelib'));
          assert (pathlib.Path(codebleu.__file__).parent / 'keywords/python.txt').is_file()"
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest --import-mode=importlib
          -c "${{ github.workspace }}/pyproject.toml"
          "${{ github.workspace }}/tests"
          --cov-report=xml:"${{ github.workspace }}/coverage.xml"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
